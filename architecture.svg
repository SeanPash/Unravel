<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="1060" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b45309"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#047857"/>
    </marker>
  </defs>

  <rect width="1060" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="530" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Unravel - Causal Reconstruction Engine</text>
  <text x="530" y="54" text-anchor="middle" font-size="12" fill="#6b7280">Engine first, AI second: 6 of 7 subcomponents are pure Go with zero LLM calls</text>

  <!-- GOAD Lab -->
  <rect x="20" y="170" width="140" height="150" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="90" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">GOAD Lab</text>
  <text x="90" y="221" text-anchor="middle" font-size="11" fill="#6b7280">dc01 (Domain Controller)</text>
  <text x="90" y="240" text-anchor="middle" font-size="11" fill="#6b7280">ws01 (victim)</text>
  <text x="90" y="266" text-anchor="middle" font-size="10" fill="#6b7280">Sysmon / WinSec / AD</text>
  <text x="90" y="282" text-anchor="middle" font-size="10" fill="#6b7280">forwarder</text>
  <text x="90" y="305" text-anchor="middle" font-size="10" font-style="italic" fill="#9ca3af">Vagrant + Ansible</text>

  <!-- Arrow: GOAD Lab to Splunk -->
  <line x1="160" y1="245" x2="217" y2="245" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Splunk -->
  <rect x="219" y="170" width="150" height="150" rx="6" fill="#eef2ff" stroke="#374151" stroke-width="1.5"/>
  <text x="294" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Splunk</text>
  <text x="294" y="218" text-anchor="middle" font-size="11" fill="#6b7280">Enterprise</text>
  <text x="294" y="237" text-anchor="middle" font-size="11" fill="#6b7280">indexed events</text>
  <line x1="239" y1="252" x2="349" y2="252" stroke="#d1d5db" stroke-width="1"/>
  <text x="294" y="272" text-anchor="middle" font-size="10" fill="#6b7280">REST jobs/export (tail in)</text>
  <text x="294" y="289" text-anchor="middle" font-size="10" fill="#6b7280">HEC (write-back out)</text>
  <text x="294" y="306" text-anchor="middle" font-size="10" font-style="italic" fill="#9ca3af">+ MCP Server / SAIA</text>

  <!-- Arrow: Splunk to Engine (REST tail ingest) -->
  <line x1="369" y1="225" x2="426" y2="225" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="397" y="216" text-anchor="middle" font-size="9" fill="#6b7280">REST tail</text>
  <text x="397" y="240" text-anchor="middle" font-size="9" fill="#6b7280">events in</text>

  <!-- Arrow: Engine to Splunk (HEC write-back) -->
  <line x1="426" y1="278" x2="369" y2="278" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="397" y="295" text-anchor="middle" font-size="9" fill="#6b7280">HEC results out</text>

  <!-- Engine box -->
  <rect x="428" y="100" width="320" height="380" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="588" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Causal Reconstruction Engine (Go)</text>

  <!-- Component rows -->
  <rect x="444" y="138" width="288" height="30" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="588" y="158" text-anchor="middle" font-size="12" fill="#1e40af">1. Ingest layer (REST tail)</text>

  <rect x="444" y="173" width="288" height="30" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="588" y="193" text-anchor="middle" font-size="12" fill="#1e40af">2. Schema mapper</text>

  <rect x="444" y="208" width="288" height="30" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="588" y="228" text-anchor="middle" font-size="12" fill="#1e40af">3. Provenance graph builder</text>

  <rect x="444" y="243" width="288" height="30" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="588" y="263" text-anchor="middle" font-size="12" fill="#1e40af">4. Temporal causal index</text>

  <rect x="444" y="278" width="288" height="30" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="588" y="298" text-anchor="middle" font-size="12" fill="#1e40af">5. Suspicion scorer</text>

  <rect x="444" y="313" width="288" height="30" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="588" y="333" text-anchor="middle" font-size="12" fill="#1e40af">6. Chain extractor</text>

  <!-- Row 7: AI narrator (amber, the only LLM seam) -->
  <rect x="444" y="348" width="288" height="34" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="588" y="364" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">7. AI narrator (agent) *</text>
  <text x="588" y="377" text-anchor="middle" font-size="9" fill="#b45309">+ threat-intel agent</text>

  <!-- in-engine notes -->
  <text x="588" y="404" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7280">in-memory graph + BadgerDB snapshots</text>
  <text x="588" y="419" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7280">React UI embedded via go:embed</text>
  <text x="588" y="447" text-anchor="middle" font-size="9" font-style="italic" fill="#9ca3af">rows 1-6: pure Go, zero LLM calls</text>
  <text x="588" y="462" text-anchor="middle" font-size="9" font-style="italic" fill="#92400e">* only LLM-touching component</text>

  <!-- Arrow: Engine to Browser -->
  <line x1="748" y1="200" x2="817" y2="200" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="782" y="191" text-anchor="middle" font-size="10" fill="#6b7280">WebSocket</text>

  <!-- Browser -->
  <rect x="819" y="150" width="220" height="160" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="929" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Browser UI</text>
  <text x="929" y="200" text-anchor="middle" font-size="11" fill="#6b7280">React 18 + Cytoscape.js</text>
  <text x="929" y="222" text-anchor="middle" font-size="11" fill="#6b7280">live provenance graph</text>
  <text x="929" y="241" text-anchor="middle" font-size="11" fill="#6b7280">narration + phase cards</text>
  <text x="929" y="260" text-anchor="middle" font-size="11" fill="#6b7280">investigation feed</text>
  <text x="929" y="287" text-anchor="middle" font-size="10" font-style="italic" fill="#9ca3af">time scrubber, minimap</text>

  <!-- Gemini (narration LLM) -->
  <rect x="819" y="350" width="220" height="100" rx="6" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
  <text x="929" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Google Gemini</text>
  <text x="929" y="398" text-anchor="middle" font-size="11" fill="#047857">3.1 Flash Lite</text>
  <text x="929" y="418" text-anchor="middle" font-size="10" fill="#047857">narration LLM (agent)</text>
  <text x="929" y="436" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7280">tool-use + implicit cache</text>

  <!-- Arrow: narrator to Gemini -->
  <line x1="732" y1="365" x2="817" y2="395" stroke="#047857" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="775" y="372" text-anchor="middle" font-size="9" fill="#047857">narrate</text>

  <!-- Splunk MCP Server / SAIA: narrator enrichment hop (AI seam, amber) -->
  <rect x="219" y="360" width="180" height="120" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="309" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Splunk MCP Server</text>
  <text x="309" y="406" text-anchor="middle" font-size="10" fill="#b45309">splunk_run_query (run SPL)</text>
  <text x="309" y="424" text-anchor="middle" font-size="10" fill="#b45309">saia_generate_spl (SAIA)</text>
  <text x="309" y="442" text-anchor="middle" font-size="9" fill="#6b7280">Splunk AI Assistant: NL to SPL</text>
  <text x="309" y="467" text-anchor="middle" font-size="9" font-style="italic" fill="#9ca3af">live mode; REST fallback</text>

  <!-- Arrow: AI narrator to MCP Server (agentic tool-use) -->
  <line x1="444" y1="372" x2="402" y2="395" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="430" y="388" text-anchor="middle" font-size="9" fill="#b45309">tool-use</text>

  <!-- Arrow: MCP Server runs SPL against Splunk -->
  <line x1="309" y1="360" x2="309" y2="322" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="326" y="344" text-anchor="start" font-size="9" fill="#b45309">runs SPL</text>

  <!-- External threat intel -->
  <rect x="20" y="360" width="180" height="120" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="110" y="385" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">External Intel</text>
  <text x="110" y="408" text-anchor="middle" font-size="11" fill="#6b7280">CISA KEV</text>
  <text x="110" y="427" text-anchor="middle" font-size="11" fill="#6b7280">NVD (CVE)</text>
  <text x="110" y="446" text-anchor="middle" font-size="11" fill="#6b7280">MITRE ATT&amp;CK</text>
  <text x="110" y="468" text-anchor="middle" font-size="9" font-style="italic" fill="#9ca3af">bundled snapshot fallback</text>

  <!-- Arrow: threat-intel agent to External Intel -->
  <line x1="444" y1="378" x2="202" y2="408" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="320" y="398" text-anchor="middle" font-size="9" fill="#b45309">intel agent: lookup KEV / CVE / technique</text>

  <!-- Legend -->
  <rect x="20" y="500" width="1019" height="42" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="36" y="514" width="16" height="14" rx="2" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="60" y="526" font-size="11" fill="#374151">Pure Go (no LLM)</text>
  <rect x="190" y="514" width="16" height="14" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="214" y="526" font-size="11" fill="#374151">AI seam (LLM / agent tool-use)</text>
  <rect x="430" y="514" width="16" height="14" rx="2" fill="#dcfce7" stroke="#047857"/>
  <text x="454" y="526" font-size="11" fill="#374151">Narration LLM (Gemini)</text>
  <line x1="640" y1="521" x2="672" y2="521" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="680" y="526" font-size="11" fill="#374151">data flow</text>
  <line x1="770" y1="521" x2="802" y2="521" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="810" y="526" font-size="11" fill="#374151">agent tool-use (enrichment only)</text>
</svg>
