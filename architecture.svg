<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 Z" fill="#334155"/>
    </marker>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1120" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="560" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Unravel: Causal Reconstruction Engine</text>
  <text x="560" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">Engine first, AI second. Six of seven subcomponents are pure Go with zero LLM calls.</text>

  <!-- ============ Left: lab + Splunk ============ -->

  <!-- GOAD Lab -->
  <rect x="30" y="160" width="130" height="150" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
  <text x="95" y="184" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">GOAD Lab</text>
  <text x="95" y="207" text-anchor="middle" font-size="10" fill="#64748b">dc01 (DC)</text>
  <text x="95" y="224" text-anchor="middle" font-size="10" fill="#64748b">ws01 (victim)</text>
  <text x="95" y="241" text-anchor="middle" font-size="10" fill="#64748b">srv02 (relay)</text>
  <text x="95" y="263" text-anchor="middle" font-size="9.5" fill="#64748b">Sysmon, WinSec, AD</text>
  <text x="95" y="285" text-anchor="middle" font-size="9" font-style="italic" fill="#94a3b8">Universal Forwarder</text>

  <!-- Forwarder arrow GOAD to Splunk -->
  <line x1="160" y1="235" x2="183" y2="235" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Splunk Enterprise -->
  <rect x="185" y="160" width="140" height="150" rx="8" fill="#eef2ff" stroke="#334155" stroke-width="1.4"/>
  <text x="255" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Splunk Enterprise</text>
  <text x="255" y="203" text-anchor="middle" font-size="10" fill="#64748b">indexed events</text>
  <line x1="203" y1="214" x2="307" y2="214" stroke="#cbd5e1" stroke-width="1"/>
  <text x="255" y="234" text-anchor="middle" font-size="10" fill="#475569">REST jobs/export</text>
  <text x="255" y="250" text-anchor="middle" font-size="9.5" fill="#64748b">(streaming tail)</text>
  <text x="255" y="272" text-anchor="middle" font-size="10" fill="#475569">HEC write-back</text>

  <!-- Ingest arrow Splunk to Engine -->
  <text x="352" y="168" text-anchor="middle" font-size="8.5" fill="#475569">REST tail</text>
  <line x1="325" y1="176" x2="378" y2="176" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="352" y="190" text-anchor="middle" font-size="8" fill="#94a3b8">events in</text>

  <!-- HEC write-back arrow Engine to Splunk -->
  <text x="352" y="248" text-anchor="middle" font-size="8.5" fill="#475569">HEC notable</text>
  <line x1="378" y1="256" x2="325" y2="256" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ============ Center: Engine ============ -->
  <rect x="380" y="100" width="380" height="448" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="570" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Causal Reconstruction Engine (Go)</text>
  <text x="570" y="138" text-anchor="middle" font-size="10" fill="#64748b">seven streaming subcomponents</text>

  <!-- Row 1 -->
  <rect x="410" y="150" width="320" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="424" y="174" font-size="12.5" font-weight="600" fill="#1e3a8a">1. Ingest layer</text>
  <text x="716" y="174" text-anchor="end" font-size="10" fill="#64748b">Splunk REST tail to envelope</text>
  <line x1="570" y1="188" x2="570" y2="201" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Row 2 -->
  <rect x="410" y="201" width="320" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="424" y="225" font-size="12.5" font-weight="600" fill="#1e3a8a">2. Schema mapper</text>
  <text x="716" y="225" text-anchor="end" font-size="10" fill="#64748b">typed structs per source</text>
  <line x1="570" y1="239" x2="570" y2="252" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Row 3 -->
  <rect x="410" y="252" width="320" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="424" y="276" font-size="12.5" font-weight="600" fill="#1e3a8a">3. Provenance graph builder</text>
  <text x="716" y="276" text-anchor="end" font-size="10" fill="#64748b">incremental, in-memory</text>
  <line x1="570" y1="290" x2="570" y2="303" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Row 4 -->
  <rect x="410" y="303" width="320" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="424" y="327" font-size="12.5" font-weight="600" fill="#1e3a8a">4. Temporal causal index</text>
  <text x="716" y="327" text-anchor="end" font-size="10" fill="#64748b">time-bucketed lookups</text>
  <line x1="570" y1="341" x2="570" y2="354" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Row 5 -->
  <rect x="410" y="354" width="320" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="424" y="378" font-size="12.5" font-weight="600" fill="#1e3a8a">5. Suspicion scorer</text>
  <text x="716" y="378" text-anchor="end" font-size="10" fill="#64748b">rarity x decay x lift</text>
  <line x1="570" y1="392" x2="570" y2="405" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Row 6 -->
  <rect x="410" y="405" width="320" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="424" y="429" font-size="12.5" font-weight="600" fill="#1e3a8a">6. Chain extractor</text>
  <text x="716" y="429" text-anchor="end" font-size="10" fill="#64748b">max-suspicion backward walk</text>
  <line x1="570" y1="443" x2="570" y2="456" stroke="#b45309" stroke-width="1.3" marker-end="url(#arrA)"/>

  <!-- Row 7: AI seam -->
  <rect x="410" y="456" width="320" height="44" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="424" y="476" font-size="12.5" font-weight="700" fill="#92400e">7. AI narrator + threat-intel agent</text>
  <text x="424" y="491" font-size="9.5" fill="#b45309">chain to plain English, hypotheses, containment</text>
  <text x="716" y="481" text-anchor="end" font-size="10" font-style="italic" fill="#b45309">AI seam</text>

  <!-- Engine notes -->
  <text x="570" y="520" text-anchor="middle" font-size="9.5" font-style="italic" fill="#64748b">In-memory provenance graph, periodic BadgerDB snapshots. React UI embedded via go:embed.</text>
  <text x="570" y="536" text-anchor="middle" font-size="9.5" font-style="italic" fill="#92400e">Row 7 is the only LLM-touching hop. AI-off mode skips it and still ships a reconstructed chain.</text>

  <!-- ============ Right: UI + Gemini ============ -->

  <!-- WebSocket arrow Engine to Browser -->
  <text x="780" y="188" text-anchor="middle" font-size="9" fill="#475569">WebSocket</text>
  <line x1="760" y1="195" x2="798" y2="195" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Browser UI -->
  <rect x="800" y="120" width="290" height="150" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
  <text x="945" y="146" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Browser UI</text>
  <text x="945" y="168" text-anchor="middle" font-size="10.5" fill="#64748b">React 18 + Cytoscape.js</text>
  <text x="945" y="190" text-anchor="middle" font-size="10.5" fill="#64748b">live provenance graph</text>
  <text x="945" y="210" text-anchor="middle" font-size="10.5" fill="#64748b">narration + phase cards</text>
  <text x="945" y="230" text-anchor="middle" font-size="10.5" fill="#64748b">live agent activity feed</text>
  <text x="945" y="252" text-anchor="middle" font-size="9.5" font-style="italic" fill="#94a3b8">time scrubber, minimap</text>

  <!-- Narrate arrow Engine row 7 to Gemini -->
  <text x="780" y="462" text-anchor="middle" font-size="9" fill="#b45309">narrate /</text>
  <text x="780" y="473" text-anchor="middle" font-size="9" fill="#b45309">enrich</text>
  <line x1="760" y1="486" x2="798" y2="478" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrA)"/>

  <!-- Gemini -->
  <rect x="800" y="400" width="290" height="150" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="945" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Google Gemini</text>
  <text x="945" y="448" text-anchor="middle" font-size="11" fill="#047857">3.1 Flash Lite</text>
  <text x="945" y="470" text-anchor="middle" font-size="10.5" fill="#047857">narrator + threat-intel agent</text>
  <text x="945" y="490" text-anchor="middle" font-size="10" fill="#475569">tool-use loop, max 3 rounds</text>
  <text x="945" y="512" text-anchor="middle" font-size="9.5" fill="#475569">static schema preamble, implicit cache</text>
  <text x="945" y="532" text-anchor="middle" font-size="9.5" font-style="italic" fill="#94a3b8">tool calls: see ai-architecture.svg</text>

  <!-- ============ Legend ============ -->
  <rect x="30" y="572" width="1060" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="46" y="589" width="15" height="14" rx="2" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="69" y="600" font-size="11" fill="#334155">Pure Go subcomponent (no LLM)</text>
  <rect x="290" y="589" width="15" height="14" rx="2" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="313" y="600" font-size="11" fill="#334155">AI seam (LLM hop)</text>
  <rect x="460" y="589" width="15" height="14" rx="2" fill="#ecfdf5" stroke="#047857"/>
  <text x="483" y="600" font-size="11" fill="#334155">Gemini model</text>
  <line x1="610" y1="596" x2="642" y2="596" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="650" y="600" font-size="11" fill="#334155">data flow</text>
  <line x1="760" y1="596" x2="792" y2="596" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="800" y="600" font-size="11" fill="#334155">AI request / response</text>
</svg>
