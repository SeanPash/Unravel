<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1000" height="360" fill="#ffffff"/>

  <!-- GOAD Lab -->
  <rect x="15" y="90" width="140" height="180" rx="4" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="85" y="116" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#111827">GOAD Lab</text>
  <text x="85" y="143" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#6b7280">dc01</text>
  <text x="85" y="162" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#6b7280">Domain Controller</text>
  <text x="85" y="187" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#6b7280">ws01</text>
  <text x="85" y="206" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#6b7280">Workstation (victim)</text>
  <text x="85" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-style="italic" fill="#9ca3af">Vagrant + Ansible</text>

  <!-- Arrow: GOAD Lab to Splunk -->
  <line x1="155" y1="180" x2="232" y2="180" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="194" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#6b7280">Sysmon / WinSec</text>
  <text x="194" y="179" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#6b7280">/ AD forwarder</text>

  <!-- Splunk -->
  <rect x="234" y="120" width="130" height="120" rx="4" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="299" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#111827">Splunk</text>
  <text x="299" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#6b7280">Enterprise</text>
  <text x="299" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#6b7280">indexed events</text>
  <text x="299" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-style="italic" fill="#9ca3af">HEC write-back</text>

  <!-- Arrow: Splunk to Engine -->
  <line x1="364" y1="180" x2="422" y2="180" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="393" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#6b7280">REST tail</text>

  <!-- Engine box -->
  <rect x="424" y="10" width="312" height="340" rx="4" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="580" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#111827">Causal Reconstruction Engine (Go)</text>

  <!-- Component rows: x=440, w=280, h=28, gap=5 -->
  <rect x="440" y="48" width="280" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="580" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1e40af">1. Ingest layer</text>

  <rect x="440" y="81" width="280" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="580" y="99" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1e40af">2. Schema mapper</text>

  <rect x="440" y="114" width="280" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="580" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1e40af">3. Provenance graph builder</text>

  <rect x="440" y="147" width="280" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="580" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1e40af">4. Temporal causal index</text>

  <rect x="440" y="180" width="280" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="580" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1e40af">5. Suspicion scorer</text>

  <rect x="440" y="213" width="280" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="580" y="231" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1e40af">6. Chain extractor</text>

  <!-- Row 7: AI narrator (amber) -->
  <rect x="440" y="246" width="280" height="28" rx="3" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="580" y="264" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#92400e">7. AI narrator *</text>

  <!-- Legend -->
  <text x="580" y="298" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-style="italic" fill="#6b7280">* only LLM-touching component</text>
  <text x="580" y="336" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-style="italic" fill="#9ca3af">rows 1-6: pure Go, zero LLM calls</text>

  <!-- Arrow: Engine to Browser -->
  <line x1="736" y1="180" x2="793" y2="180" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="764" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#6b7280">WebSocket</text>

  <!-- Browser -->
  <rect x="795" y="90" width="155" height="180" rx="4" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="872" y="116" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#111827">Browser</text>
  <text x="872" y="143" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#6b7280">React +</text>
  <text x="872" y="162" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#6b7280">Cytoscape.js</text>
  <text x="872" y="187" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#6b7280">live force graph</text>
  <text x="872" y="206" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#6b7280">narration panel</text>
  <text x="872" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-style="italic" fill="#9ca3af">time scrubber</text>
</svg>
