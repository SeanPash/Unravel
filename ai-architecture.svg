<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 870" width="1120" height="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b45309"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#047857"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1120" height="870" fill="#ffffff"/>

  <!-- Title -->
  <text x="560" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Unravel - How the AI Agents Work</text>
  <text x="560" y="52" text-anchor="middle" font-size="12" fill="#6b7280">Structured engine output goes in, structured natural language comes out. The model never decides the attack chain.</text>

  <!-- Engine -->
  <rect x="40" y="74" width="1040" height="54" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="560" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Engine (pure Go, subcomponents 1-6) - zero LLM calls</text>
  <text x="560" y="116" text-anchor="middle" font-size="11" fill="#1e40af">Suspicion scorer crosses --threshold, then chain.Extract emits a ChainResultPayload (also broadcast as chain_result + HEC write-back)</text>

  <!-- AI seam -->
  <line x1="40" y1="146" x2="1080" y2="146" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="48" y="141" font-size="11" font-weight="700" fill="#92400e">AI SEAM - the only LLM stage; the narrator and threat-intel agents run concurrently per chain (sync.WaitGroup)</text>

  <line x1="300" y1="128" x2="300" y2="176" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="308" y="170" font-size="9" fill="#6b7280">chain</text>
  <line x1="820" y1="128" x2="820" y2="176" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="828" y="170" font-size="9" fill="#6b7280">chain</text>

  <!-- Narrator agent -->
  <rect x="40" y="178" width="500" height="262" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="290" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Narrator agent (GeminiNarrator)</text>
  <text x="290" y="222" text-anchor="middle" font-size="10" fill="#b45309">internal/ai/gemini.go - writes the structured incident report</text>
  <text x="58" y="246" font-size="10" fill="#374151">in:  chain JSON (ChainResultPayload)</text>
  <text x="58" y="265" font-size="10" fill="#374151">out: NarrationPayload - summary, severity, findings, actions, phases</text>
  <text x="58" y="288" font-size="10" font-weight="600" fill="#92400e">read-only tools</text>
  <rect x="56" y="294" width="468" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="66" y="309" font-size="9" fill="#92400e">lookup_process_reputation</text>
  <rect x="56" y="318" width="468" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="66" y="333" font-size="9" fill="#92400e">get_account_logon_history</text>
  <rect x="56" y="342" width="468" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="66" y="357" font-size="9" fill="#92400e">fetch_raw_events</text>
  <rect x="56" y="366" width="468" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="66" y="381" font-size="9" fill="#92400e">splunk_search  -  ad-hoc read-only SPL</text>
  <rect x="56" y="390" width="468" height="22" rx="3" fill="#fde68a" stroke="#f59e0b"/>
  <text x="66" y="405" font-size="9" fill="#92400e">splunk_nl_search  -  live + MCP only</text>

  <!-- Threat-intel agent -->
  <rect x="580" y="178" width="500" height="262" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="830" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Threat-intel agent (GeminiIntelAgent)</text>
  <text x="830" y="222" text-anchor="middle" font-size="10" fill="#b45309">internal/ai/intel.go - correlates techniques to ATT&amp;CK + CVE</text>
  <text x="598" y="246" font-size="10" fill="#374151">in:  chain JSON (ChainResultPayload)</text>
  <text x="598" y="265" font-size="10" fill="#374151">out: ThreatIntelPayload - techniques, groups, mitigations, CVEs</text>
  <text x="598" y="288" font-size="10" font-weight="600" fill="#92400e">tools</text>
  <rect x="596" y="294" width="468" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="606" y="309" font-size="9" fill="#92400e">lookup_technique_intel  -  ATT&amp;CK snapshot (local)</text>
  <rect x="596" y="318" width="468" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="606" y="333" font-size="9" fill="#92400e">lookup_kev  -  CISA KEV</text>
  <rect x="596" y="342" width="468" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="606" y="357" font-size="9" fill="#92400e">search_cve  -  NVD</text>
  <text x="598" y="392" font-size="9" font-style="italic" fill="#6b7280">techniques resolve against the bundled ATT&amp;CK snapshot; KEV and CVE are live REST</text>

  <!-- Shared loop to Gemini -->
  <line x1="300" y1="440" x2="462" y2="500" stroke="#047857" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="820" y1="440" x2="658" y2="500" stroke="#047857" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="560" y="466" text-anchor="middle" font-size="10" fill="#047857">each agent runs a function-calling loop, up to 3 rounds, until it returns final JSON</text>

  <!-- Gemini -->
  <rect x="460" y="500" width="200" height="84" rx="6" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
  <text x="560" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Google Gemini</text>
  <text x="560" y="542" text-anchor="middle" font-size="11" fill="#047857">3.1 Flash Lite</text>
  <text x="560" y="559" text-anchor="middle" font-size="9" fill="#047857">generateContent + function-calling</text>
  <text x="560" y="574" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7280">implicit cache on static prefix</text>

  <!-- Narrator Splunk path -->
  <rect x="40" y="500" width="220" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="522" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Read-only SPL guard</text>
  <text x="150" y="540" text-anchor="middle" font-size="9" fill="#1e40af">allowlist, rejects injection (pure Go)</text>
  <rect x="40" y="568" width="220" height="92" rx="6" fill="#eef2ff" stroke="#374151" stroke-width="1.5"/>
  <text x="150" y="590" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Splunk searcher</text>
  <text x="150" y="608" text-anchor="middle" font-size="9" fill="#6b7280">REST search/jobs/export (live)</text>
  <text x="150" y="624" text-anchor="middle" font-size="9" fill="#6b7280">MCP: splunk_run_query + SAIA (live+MCP)</text>
  <text x="150" y="640" text-anchor="middle" font-size="9" font-style="italic" fill="#9ca3af">Mock searcher (replay)</text>
  <line x1="130" y1="440" x2="130" y2="498" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="138" y="470" font-size="9" fill="#b45309">tools build SPL</text>
  <line x1="130" y1="554" x2="130" y2="566" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- Intel sources -->
  <rect x="860" y="500" width="220" height="50" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="970" y="521" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">MITRE ATT&amp;CK snapshot</text>
  <text x="970" y="538" text-anchor="middle" font-size="9" fill="#1e40af">local lookup (pure Go)</text>
  <rect x="860" y="564" width="220" height="92" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="970" y="586" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">External threat intel</text>
  <text x="970" y="606" text-anchor="middle" font-size="9" fill="#6b7280">CISA KEV (live REST)</text>
  <text x="970" y="622" text-anchor="middle" font-size="9" fill="#6b7280">NVD CVE (live REST)</text>
  <text x="970" y="640" text-anchor="middle" font-size="9" font-style="italic" fill="#9ca3af">bundled snapshot fallback</text>
  <line x1="950" y1="440" x2="950" y2="498" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="942" y="470" text-anchor="end" font-size="9" fill="#b45309">technique lookup</text>
  <path d="M 1010 440 L 1010 462 L 1098 462 L 1098 590 L 1082 590" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="1002" y="455" text-anchor="end" font-size="9" fill="#b45309">KEV / CVE</text>

  <!-- Browser -->
  <rect x="460" y="700" width="200" height="96" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="560" y="724" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Browser UI</text>
  <text x="560" y="745" text-anchor="middle" font-size="10" fill="#6b7280">live agent activity feed</text>
  <text x="560" y="763" text-anchor="middle" font-size="10" fill="#6b7280">narration + threat-intel tabs</text>
  <text x="560" y="782" text-anchor="middle" font-size="9" font-style="italic" fill="#9ca3af">streamed over WebSocket</text>
  <line x1="250" y1="440" x2="466" y2="700" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="352" y="612" font-size="9" fill="#6b7280">narration + activity (WS)</text>
  <line x1="870" y1="440" x2="654" y2="700" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="768" y="612" text-anchor="end" font-size="9" fill="#6b7280">threat-intel + activity (WS)</text>

  <!-- Fallback note -->
  <rect x="40" y="710" width="300" height="86" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="56" y="732" font-size="11" font-weight="700" fill="#374151">Fallback: no API key or --mode=ai-off</text>
  <text x="56" y="752" font-size="9" fill="#6b7280">narrator becomes a deterministic stub</text>
  <text x="56" y="768" font-size="9" fill="#6b7280">intel returns the ATT&amp;CK snapshot only</text>
  <text x="56" y="786" font-size="9" font-style="italic" fill="#9ca3af">no model, no network, every tab still works</text>

  <!-- Legend -->
  <rect x="40" y="814" width="1040" height="40" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="56" y="828" width="16" height="14" rx="2" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="80" y="840" font-size="11" fill="#374151">Pure Go (no LLM)</text>
  <rect x="220" y="828" width="16" height="14" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="244" y="840" font-size="11" fill="#374151">AI seam (agent / tool-use)</text>
  <rect x="430" y="828" width="16" height="14" rx="2" fill="#dcfce7" stroke="#047857"/>
  <text x="454" y="840" font-size="11" fill="#374151">Gemini model</text>
  <line x1="580" y1="835" x2="612" y2="835" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="620" y="840" font-size="11" fill="#374151">tool-use</text>
  <line x1="720" y1="835" x2="752" y2="835" stroke="#047857" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="760" y="840" font-size="11" fill="#374151">LLM call</text>
  <line x1="860" y1="835" x2="892" y2="835" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="900" y="840" font-size="11" fill="#374151">data flow</text>
</svg>
