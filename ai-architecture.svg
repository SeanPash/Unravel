<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 860" width="1120" height="860" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 Z" fill="#334155"/>
    </marker>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 Z" fill="#b45309"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 Z" fill="#047857"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1120" height="860" fill="#ffffff"/>

  <!-- Subtitle (no title: the README supplies the heading) -->
  <text x="560" y="40" text-anchor="middle" font-size="12.5" fill="#64748b">Structured engine output goes in, structured natural language comes out. The model never decides the attack chain.</text>

  <!-- Engine bar -->
  <rect x="40" y="64" width="1040" height="58" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
  <text x="560" y="89" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Engine (pure Go, subcomponents 1-6): zero LLM calls</text>
  <text x="560" y="109" text-anchor="middle" font-size="10.5" fill="#1e40af">Scorer crosses the threshold, then the chain extractor emits a ChainResultPayload (also broadcast as chain_result and HEC write-back).</text>

  <!-- chain handoff arrows -->
  <line x1="290" y1="122" x2="290" y2="158" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="298" y="146" font-size="9" fill="#64748b">chain</text>
  <line x1="830" y1="122" x2="830" y2="158" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="838" y="146" font-size="9" fill="#64748b">chain</text>

  <!-- ============ Narrator agent ============ -->
  <rect x="40" y="160" width="510" height="304" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="40" y="160" width="510" height="46" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="40" y="196" width="510" height="10" fill="#fffbeb"/>
  <text x="58" y="184" font-size="14" font-weight="700" fill="#92400e">Narrator agent</text>
  <text x="58" y="200" font-size="9.5" fill="#b45309">internal/ai/gemini.go, writes the structured incident report</text>
  <line x1="40" y1="206" x2="550" y2="206" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="56" y="224" font-size="9.5" fill="#475569">in:  chain JSON (ChainResultPayload)</text>
  <text x="56" y="240" font-size="9.5" fill="#475569">out: NarrationPayload (summary, severity, findings, actions, phases)</text>

  <g>
    <rect x="56" y="252" width="478" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="56" y="252" width="4" height="36" fill="#f59e0b"/>
    <text x="72" y="269" font-size="11" font-weight="600" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lookup_process_reputation</text>
    <text x="72" y="282" font-size="9" fill="#64748b">to Splunk: flag a process image in the threat-intel index</text>
  </g>
  <g>
    <rect x="56" y="292" width="478" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="56" y="292" width="4" height="36" fill="#f59e0b"/>
    <text x="72" y="309" font-size="11" font-weight="600" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">get_account_logon_history</text>
    <text x="72" y="322" font-size="9" fill="#64748b">to Splunk: 4624 / 4625 logon history for an account</text>
  </g>
  <g>
    <rect x="56" y="332" width="478" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="56" y="332" width="4" height="36" fill="#f59e0b"/>
    <text x="72" y="349" font-size="11" font-weight="600" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">fetch_raw_events</text>
    <text x="72" y="362" font-size="9" fill="#64748b">to Splunk: raw log lines for the chain EventCodes</text>
  </g>
  <g>
    <rect x="56" y="372" width="478" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="56" y="372" width="4" height="36" fill="#f59e0b"/>
    <text x="72" y="389" font-size="11" font-weight="600" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">splunk_search</text>
    <text x="72" y="402" font-size="9" fill="#64748b">to Splunk: arbitrary read-only SPL query</text>
  </g>
  <g>
    <rect x="56" y="412" width="478" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="56" y="412" width="4" height="36" fill="#f59e0b"/>
    <text x="72" y="429" font-size="11" font-weight="600" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">splunk_nl_search</text>
    <text x="72" y="442" font-size="9" fill="#64748b">to Splunk AI Assistant (SAIA): natural language to SPL (live + MCP only)</text>
  </g>

  <!-- ============ Threat-intel agent ============ -->
  <rect x="570" y="160" width="510" height="304" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="570" y="160" width="510" height="46" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="570" y="196" width="510" height="10" fill="#fffbeb"/>
  <text x="588" y="184" font-size="14" font-weight="700" fill="#92400e">Threat-intel agent</text>
  <text x="588" y="200" font-size="9.5" fill="#b45309">internal/ai/intel.go, correlates techniques to ATT&amp;CK and CVE</text>
  <line x1="570" y1="206" x2="1080" y2="206" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="586" y="224" font-size="9.5" fill="#475569">in:  chain JSON (ChainResultPayload)</text>
  <text x="586" y="240" font-size="9.5" fill="#475569">out: ThreatIntelPayload (techniques, groups, mitigations, CVE / KEV)</text>

  <g>
    <rect x="586" y="252" width="478" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="586" y="252" width="4" height="36" fill="#f59e0b"/>
    <text x="602" y="269" font-size="11" font-weight="600" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lookup_technique_intel</text>
    <text x="602" y="282" font-size="9" fill="#64748b">to MITRE ATT&amp;CK: groups, software, mitigations (local snapshot)</text>
  </g>
  <g>
    <rect x="586" y="292" width="478" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="586" y="292" width="4" height="36" fill="#f59e0b"/>
    <text x="602" y="309" font-size="11" font-weight="600" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lookup_kev</text>
    <text x="602" y="322" font-size="9" fill="#64748b">to CISA KEV: search the Known Exploited Vulnerabilities catalog</text>
  </g>
  <g>
    <rect x="586" y="332" width="478" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="586" y="332" width="4" height="36" fill="#f59e0b"/>
    <text x="602" y="349" font-size="11" font-weight="600" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">search_cve</text>
    <text x="602" y="362" font-size="9" fill="#64748b">to NVD: search the CVE database by keyword</text>
  </g>
  <text x="602" y="392" font-size="9.5" font-style="italic" fill="#64748b">ATT&amp;CK resolves against the bundled snapshot. KEV and CVE are live REST,</text>
  <text x="602" y="406" font-size="9.5" font-style="italic" fill="#64748b">with a bundled-snapshot fallback when the network is unavailable.</text>

  <!-- ============ Shared Gemini loop ============ -->
  <line x1="290" y1="464" x2="468" y2="500" stroke="#047857" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="830" y1="464" x2="652" y2="500" stroke="#047857" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="560" y="478" text-anchor="middle" font-size="10" fill="#047857">each agent runs a function-calling loop, up to 3 rounds,</text>
  <text x="560" y="491" text-anchor="middle" font-size="10" fill="#047857">until it returns final JSON</text>

  <rect x="460" y="500" width="200" height="86" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="560" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Google Gemini</text>
  <text x="560" y="543" text-anchor="middle" font-size="11" fill="#047857">3.1 Flash Lite</text>
  <text x="560" y="560" text-anchor="middle" font-size="9" fill="#047857">generateContent + function-calling</text>
  <text x="560" y="575" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">implicit cache on static prefix</text>

  <!-- ============ Narrator Splunk path ============ -->
  <line x1="120" y1="464" x2="120" y2="508" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="128" y="488" font-size="9" fill="#b45309">tools build SPL</text>

  <rect x="40" y="510" width="220" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="532" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Read-only SPL guard</text>
  <text x="150" y="549" text-anchor="middle" font-size="9" fill="#1e40af">allowlist, rejects injection (pure Go)</text>
  <line x1="150" y1="562" x2="150" y2="574" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>

  <rect x="40" y="576" width="220" height="96" rx="8" fill="#eef2ff" stroke="#334155" stroke-width="1.5"/>
  <text x="150" y="598" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Splunk searcher</text>
  <text x="150" y="617" text-anchor="middle" font-size="9" fill="#475569">REST search/jobs/export (live)</text>
  <text x="150" y="633" text-anchor="middle" font-size="9" fill="#475569">MCP: splunk_run_query + SAIA (live + MCP)</text>
  <text x="150" y="652" text-anchor="middle" font-size="9" font-style="italic" fill="#94a3b8">mock searcher (replay)</text>

  <!-- ============ Intel sources ============ -->
  <line x1="950" y1="464" x2="950" y2="508" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="942" y="488" text-anchor="end" font-size="9" fill="#b45309">technique lookup</text>
  <path d="M 1012 464 L 1012 484 L 1098 484 L 1098 600 L 1082 600" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="1004" y="478" text-anchor="end" font-size="9" fill="#b45309">KEV / CVE</text>

  <rect x="860" y="510" width="220" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
  <text x="970" y="532" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">MITRE ATT&amp;CK snapshot</text>
  <text x="970" y="549" text-anchor="middle" font-size="9" fill="#1e40af">local lookup (pure Go)</text>

  <rect x="860" y="576" width="220" height="96" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="970" y="598" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">External threat intel</text>
  <text x="970" y="617" text-anchor="middle" font-size="9" fill="#475569">CISA KEV (live REST)</text>
  <text x="970" y="633" text-anchor="middle" font-size="9" fill="#475569">NVD CVE (live REST)</text>
  <text x="970" y="652" text-anchor="middle" font-size="9" font-style="italic" fill="#94a3b8">bundled snapshot fallback</text>

  <!-- ============ Browser UI ============ -->
  <line x1="250" y1="464" x2="466" y2="710" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="470" y="636" text-anchor="middle" font-size="9" fill="#64748b">narration + activity (WS)</text>
  <line x1="870" y1="464" x2="654" y2="710" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="652" y="636" text-anchor="middle" font-size="9" fill="#64748b">threat-intel + activity (WS)</text>

  <rect x="460" y="712" width="200" height="96" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="560" y="736" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Browser UI</text>
  <text x="560" y="757" text-anchor="middle" font-size="10" fill="#475569">live agent activity feed</text>
  <text x="560" y="775" text-anchor="middle" font-size="10" fill="#475569">narration + threat-intel tabs</text>
  <text x="560" y="793" text-anchor="middle" font-size="9" font-style="italic" fill="#94a3b8">streamed over WebSocket</text>

  <!-- ============ Fallback ============ -->
  <rect x="40" y="712" width="300" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="734" font-size="11" font-weight="700" fill="#334155">Fallback: no API key or ai-off mode</text>
  <text x="56" y="754" font-size="9" fill="#64748b">narrator becomes a deterministic stub</text>
  <text x="56" y="770" font-size="9" fill="#64748b">intel returns the ATT&amp;CK snapshot only</text>
  <text x="56" y="788" font-size="9" font-style="italic" fill="#94a3b8">no model, no network, every tab still works</text>

  <!-- ============ Legend ============ -->
  <rect x="40" y="816" width="1040" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="56" y="828" width="15" height="13" rx="2" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="79" y="839" font-size="11" fill="#334155">Pure Go (no LLM)</text>
  <rect x="220" y="828" width="15" height="13" rx="2" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="243" y="839" font-size="11" fill="#334155">AI seam (agent / tool-use)</text>
  <rect x="430" y="828" width="15" height="13" rx="2" fill="#ecfdf5" stroke="#047857"/>
  <text x="453" y="839" font-size="11" fill="#334155">Gemini model</text>
  <line x1="580" y1="835" x2="612" y2="835" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="620" y="839" font-size="11" fill="#334155">tool-use</text>
  <line x1="720" y1="835" x2="752" y2="835" stroke="#047857" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="760" y="839" font-size="11" fill="#334155">LLM call</text>
  <line x1="860" y1="835" x2="892" y2="835" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="900" y="839" font-size="11" fill="#334155">data flow</text>
</svg>
