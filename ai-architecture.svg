<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 990" width="1200" height="990" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b45309"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#047857"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1200" height="990" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Unravel - How the AI Agents Work</text>
  <text x="600" y="55" text-anchor="middle" font-size="12" fill="#6b7280">Structured engine output goes in, structured natural language comes out. The model never decides the attack chain.</text>

  <!-- Band 1: Engine emits the chain (pure Go) -->
  <rect x="60" y="78" width="1080" height="70" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="600" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Engine (pure Go, subcomponents 1-6) - zero LLM calls</text>
  <text x="600" y="119" text-anchor="middle" font-size="11" fill="#1e40af">Suspicion scorer crosses --threshold, then chain.Extract walks back from the hot node to produce a ChainResultPayload</text>
  <text x="600" y="137" text-anchor="middle" font-size="10" fill="#1e3a8a">{ confidence, steps:[ { event_id, description, confidence, ts, tactic, technique_id } ], tactics:[ ] }    also broadcast as chain_result + HEC write-back</text>

  <!-- AI SEAM divider -->
  <line x1="60" y1="170" x2="1140" y2="170" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="70" y="165" font-size="11" font-weight="700" fill="#92400e">AI SEAM - the only LLM-touching stage. Narrator and threat-intel agents run concurrently on each extracted chain (sync.WaitGroup).</text>

  <!-- Engine to agents -->
  <line x1="320" y1="148" x2="320" y2="194" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="328" y="186" font-size="9" fill="#6b7280">chain</text>
  <line x1="880" y1="148" x2="880" y2="194" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="888" y="186" font-size="9" fill="#6b7280">chain</text>

  <!-- ===== Narrator panel ===== -->
  <rect x="50" y="196" width="540" height="324" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Narrator agent (GeminiNarrator)</text>
  <text x="320" y="237" text-anchor="middle" font-size="10" fill="#b45309">internal/ai/gemini.go - writes the structured incident report</text>
  <text x="320" y="255" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7280">in: chain JSON + static system_instruction (cacheable prefix, Gemini implicit cache)</text>

  <!-- Narrator loop box -->
  <rect x="66" y="262" width="250" height="150" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="191" y="286" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Gemini generateContent</text>
  <text x="191" y="304" text-anchor="middle" font-size="10" fill="#b45309">function-calling tool-use loop</text>
  <text x="191" y="322" text-anchor="middle" font-size="10" fill="#b45309">maxRounds = 3</text>
  <path d="M 110 396 C 86 396, 86 286, 110 286" fill="none" stroke="#b45309" stroke-width="1.3" marker-end="url(#arrA)"/>
  <text x="191" y="360" text-anchor="middle" font-size="9" fill="#6b7280">tool result feeds the next round</text>
  <text x="191" y="392" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7280">final turn: no tool calls, emit JSON</text>

  <!-- Narrator tools -->
  <text x="454" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">read-only tools</text>
  <rect x="328" y="284" width="252" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="336" y="299" font-size="9" fill="#92400e">lookup_process_reputation</text>
  <rect x="328" y="310" width="252" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="336" y="325" font-size="9" fill="#92400e">get_account_logon_history</text>
  <rect x="328" y="336" width="252" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="336" y="351" font-size="9" fill="#92400e">fetch_raw_events</text>
  <rect x="328" y="362" width="252" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="336" y="377" font-size="9" fill="#92400e">splunk_search  (ad-hoc read-only SPL)</text>
  <rect x="328" y="388" width="252" height="22" rx="3" fill="#fde68a" stroke="#f59e0b"/>
  <text x="336" y="403" font-size="9" fill="#92400e">splunk_nl_search  [live + MCP only]</text>

  <!-- Narrator output -->
  <rect x="66" y="424" width="508" height="84" rx="5" fill="#fffef7" stroke="#fcd34d" stroke-width="1"/>
  <text x="74" y="442" font-size="10" font-weight="700" fill="#92400e">out: NarrationPayload</text>
  <text x="74" y="460" font-size="9" fill="#92400e">{ text, severity, key_findings, affected_assets,</text>
  <text x="74" y="475" font-size="9" fill="#92400e">  hypotheses, actions[ priority, action, rationale ], phases[ ] }</text>
  <text x="74" y="497" font-size="9" font-style="italic" fill="#6b7280">+ engine-authored disclaimer (not model-written)</text>

  <!-- ===== Threat-intel panel ===== -->
  <rect x="610" y="196" width="540" height="324" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="880" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Threat-intel agent (GeminiIntelAgent)</text>
  <text x="880" y="237" text-anchor="middle" font-size="10" fill="#b45309">internal/ai/intel.go - correlates techniques to ATT&amp;CK + CVE</text>
  <text x="880" y="255" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7280">in: chain JSON + static system prompt (one entry per distinct technique)</text>

  <!-- Intel loop box -->
  <rect x="626" y="262" width="250" height="150" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="751" y="286" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Gemini generateContent</text>
  <text x="751" y="304" text-anchor="middle" font-size="10" fill="#b45309">function-calling tool-use loop</text>
  <text x="751" y="322" text-anchor="middle" font-size="10" fill="#b45309">maxRounds = 3</text>
  <path d="M 670 396 C 646 396, 646 286, 670 286" fill="none" stroke="#b45309" stroke-width="1.3" marker-end="url(#arrA)"/>
  <text x="751" y="360" text-anchor="middle" font-size="9" fill="#6b7280">tool result feeds the next round</text>
  <text x="751" y="392" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7280">final turn: no tool calls, emit JSON</text>

  <!-- Intel tools -->
  <text x="1014" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">tools</text>
  <rect x="888" y="284" width="252" height="30" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="896" y="298" font-size="9" fill="#92400e">lookup_technique_intel</text>
  <text x="896" y="310" font-size="8" fill="#b45309">to bundled ATT&amp;CK snapshot (local)</text>
  <rect x="888" y="318" width="252" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="896" y="333" font-size="9" fill="#92400e">lookup_kev  to CISA KEV</text>
  <rect x="888" y="344" width="252" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="896" y="359" font-size="9" fill="#92400e">search_cve  to NVD</text>

  <!-- Intel output -->
  <rect x="626" y="424" width="508" height="84" rx="5" fill="#fffef7" stroke="#fcd34d" stroke-width="1"/>
  <text x="634" y="442" font-size="10" font-weight="700" fill="#92400e">out: ThreatIntelPayload</text>
  <text x="634" y="460" font-size="9" fill="#92400e">{ status, summary, techniques[ ], cve_matches[ ] }</text>
  <text x="634" y="475" font-size="9" fill="#92400e">techniques carry groups, software, mitigations</text>
  <text x="634" y="497" font-size="9" font-style="italic" fill="#6b7280">cve_matches flag in_kev + severity</text>

  <!-- ===== Shared Gemini model ===== -->
  <rect x="480" y="560" width="240" height="92" rx="6" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
  <text x="600" y="586" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Google Gemini</text>
  <text x="600" y="604" text-anchor="middle" font-size="11" fill="#047857">3.1 Flash Lite</text>
  <text x="600" y="621" text-anchor="middle" font-size="9" fill="#047857">generateContent + function-calling</text>
  <text x="600" y="636" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7280">implicit cache on the static prefix</text>

  <line x1="360" y1="520" x2="520" y2="558" stroke="#047857" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="430" y="540" font-size="9" fill="#047857">LLM call</text>
  <line x1="840" y1="520" x2="680" y2="558" stroke="#047857" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="770" y="540" text-anchor="end" font-size="9" fill="#047857">LLM call</text>

  <!-- ===== Narrator Splunk path (pure-Go guard then Splunk) ===== -->
  <rect x="60" y="548" width="230" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="571" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Read-only SPL guard</text>
  <text x="175" y="588" text-anchor="middle" font-size="9" fill="#1e40af">allowlist, rejects injection + backticks</text>
  <text x="175" y="602" text-anchor="middle" font-size="8" font-style="italic" fill="#6b7280">pure Go - internal/ai/spl_guard.go</text>

  <rect x="60" y="628" width="230" height="104" rx="6" fill="#eef2ff" stroke="#374151" stroke-width="1.5"/>
  <text x="175" y="650" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Splunk searcher</text>
  <text x="175" y="668" text-anchor="middle" font-size="9" fill="#6b7280">REST search/jobs/export (live)</text>
  <text x="175" y="684" text-anchor="middle" font-size="9" fill="#6b7280">MCP server: splunk_run_query (live+MCP)</text>
  <text x="175" y="700" text-anchor="middle" font-size="9" fill="#6b7280">SAIA: saia_generate_spl (NL to SPL)</text>
  <text x="175" y="716" text-anchor="middle" font-size="9" font-style="italic" fill="#9ca3af">Mock searcher (replay)</text>

  <line x1="150" y1="520" x2="150" y2="546" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text x="158" y="538" font-size="9" fill="#2563eb">every tool builds SPL</text>
  <line x1="150" y1="612" x2="150" y2="626" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text x="158" y="624" font-size="9" fill="#2563eb">guarded query</text>
  <line x1="285" y1="660" x2="285" y2="414" stroke="#374151" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="293" y="560" font-size="9" fill="#6b7280">result rows</text>

  <!-- ===== Intel sources ===== -->
  <rect x="910" y="548" width="230" height="60" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="1025" y="570" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">MITRE ATT&amp;CK snapshot</text>
  <text x="1025" y="586" text-anchor="middle" font-size="9" fill="#1e40af">bundled, local lookup</text>
  <text x="1025" y="600" text-anchor="middle" font-size="8" font-style="italic" fill="#6b7280">pure Go - internal/mitre</text>

  <rect x="910" y="624" width="230" height="96" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="1025" y="646" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">External threat intel</text>
  <text x="1025" y="664" text-anchor="middle" font-size="9" fill="#6b7280">CISA KEV catalog (live REST)</text>
  <text x="1025" y="680" text-anchor="middle" font-size="9" fill="#6b7280">NVD CVE database (live REST)</text>
  <text x="1025" y="700" text-anchor="middle" font-size="9" font-style="italic" fill="#9ca3af">bundled snapshot fallback</text>

  <line x1="980" y1="520" x2="990" y2="546" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="966" y="538" text-anchor="end" font-size="9" fill="#b45309">technique lookup</text>
  <line x1="1060" y1="520" x2="1060" y2="622" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="1068" y="560" font-size="9" fill="#b45309">KEV / CVE query</text>
  <line x1="915" y1="624" x2="915" y2="414" stroke="#374151" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="907" y="560" text-anchor="end" font-size="9" fill="#6b7280">matches</text>

  <!-- ===== Outputs: Browser ===== -->
  <rect x="470" y="780" width="260" height="118" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="600" y="806" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Browser UI</text>
  <text x="600" y="828" text-anchor="middle" font-size="10" fill="#6b7280">live agent activity feed</text>
  <text x="600" y="847" text-anchor="middle" font-size="10" fill="#6b7280">narration report + phase cards</text>
  <text x="600" y="866" text-anchor="middle" font-size="10" fill="#6b7280">threat-intel tab (ATT&amp;CK / CVE)</text>
  <text x="600" y="886" text-anchor="middle" font-size="9" font-style="italic" fill="#9ca3af">streamed over WebSocket</text>

  <line x1="300" y1="508" x2="490" y2="784" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="330" y="690" font-size="9" fill="#6b7280">narration + live activity (WS)</text>
  <line x1="900" y1="508" x2="710" y2="784" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="760" y="690" text-anchor="end" font-size="9" fill="#6b7280">threat_intel + live activity (WS)</text>

  <!-- ===== Fallback note ===== -->
  <rect x="60" y="780" width="360" height="118" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="76" y="806" font-size="12" font-weight="700" fill="#374151">Fallback: no API key or --mode=ai-off</text>
  <text x="76" y="828" font-size="10" fill="#6b7280">narrator becomes a deterministic Stub (stub.go)</text>
  <text x="76" y="847" font-size="10" fill="#6b7280">intel agent returns the ATT&amp;CK snapshot only</text>
  <text x="76" y="866" font-size="10" fill="#6b7280">no tool calls, no network, no model</text>
  <text x="76" y="886" font-size="10" font-style="italic" fill="#9ca3af">every UI tab still works with zero keys</text>
  <line x1="420" y1="838" x2="468" y2="838" stroke="#374151" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- ===== Seam guarantee callout ===== -->
  <rect x="780" y="780" width="360" height="118" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="796" y="806" font-size="12" font-weight="700" fill="#92400e">The seam guarantee</text>
  <text x="796" y="828" font-size="10" fill="#b45309">Agents only enrich their own input.</text>
  <text x="796" y="847" font-size="10" fill="#b45309">They never decide the attack chain; the Go</text>
  <text x="796" y="866" font-size="10" fill="#b45309">engine settled that before the first token.</text>
  <text x="796" y="886" font-size="10" font-style="italic" fill="#6b7280">Every tool is read-only and SPL-guarded.</text>

  <!-- ===== Legend ===== -->
  <rect x="60" y="922" width="1080" height="46" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="76" y="938" width="16" height="14" rx="2" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="100" y="950" font-size="11" fill="#374151">Pure Go (no LLM)</text>
  <rect x="236" y="938" width="16" height="14" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="260" y="950" font-size="11" fill="#374151">AI seam (agent / tool-use)</text>
  <rect x="446" y="938" width="16" height="14" rx="2" fill="#dcfce7" stroke="#047857"/>
  <text x="470" y="950" font-size="11" fill="#374151">Gemini model</text>
  <rect x="586" y="938" width="16" height="14" rx="2" fill="#eef2ff" stroke="#374151"/>
  <text x="610" y="950" font-size="11" fill="#374151">Splunk / intel source</text>
  <line x1="770" y1="945" x2="802" y2="945" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="810" y="950" font-size="11" fill="#374151">agent tool-use</text>
  <line x1="920" y1="945" x2="952" y2="945" stroke="#047857" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="960" y="950" font-size="11" fill="#374151">LLM call</text>
  <line x1="1040" y1="945" x2="1072" y2="945" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1080" y="950" font-size="11" fill="#374151">data flow</text>
</svg>
