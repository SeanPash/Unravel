# Splunk Universal Forwarder - outputs.conf
# Forwards collected events to the local Splunk Enterprise indexer.
# The indexer runs on the demo host at port 9997 (default receiving port).
#
# Deploy to: %SPLUNK_HOME%\etc\system\local\outputs.conf on dc01 and ws01.
# The Splunk Enterprise instance must have a TCP input enabled on port 9997:
#   Settings > Forwarding and receiving > Configure receiving > New Receiving Port > 9997

[tcpout]
defaultGroup = local_indexer

[tcpout:local_indexer]
# Update this IP to match the demo host's address on the host-only adapter.
server = 192.168.56.1:9997
compressed = true

[tcpout-server://192.168.56.1:9997]
