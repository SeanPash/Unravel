# Splunk Universal Forwarder - inputs.conf
# Collects the event channels required by the Causal Reconstruction Engine.
# Deploy to: %SPLUNK_HOME%\etc\system\local\inputs.conf on dc01 and ws01.

# Sysmon: process creation (1), network connection (3),
#         process access (10), file creation (11)
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = main
sourcetype = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
renderXml = true
evt_resolve_ad_obj = 1
whitelist = EventCode=1,3,10,11
checkpointInterval = 5

# Windows Security: successful/failed logon (4624/4625),
#                   special privilege use (4672),
#                   Kerberos TGT request (4768), Kerberos service ticket (4769)
[WinEventLog://Security]
disabled = 0
index = main
sourcetype = XmlWinEventLog:Security
renderXml = true
evt_resolve_ad_obj = 1
whitelist = EventCode=4624,4625,4672,4768,4769
checkpointInterval = 5

# Active Directory: directory service access and replication events
[WinEventLog://Directory Service]
disabled = 0
index = main
sourcetype = WinEventLog:DirectoryService
renderXml = false
evt_resolve_ad_obj = 1
checkpointInterval = 5
